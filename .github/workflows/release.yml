name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: 'Code Quality & Tests'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  release:
    name: Create Release
    needs: wait-for-ci
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      # Set by the successCmd of .releaserc.json when a version is published.
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/exec \
            @semantic-release/github

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  sync-develop:
    # semantic-release pushes its chore(release) commit (version + CHANGELOG)
    # straight to main: merge main back so develop stays level with it.
    name: Sync develop with main
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -m "chore(merge): merge branch 'main' into develop" origin/main
          git push origin develop

  linux:
    name: Linux AppImages
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      SOK_ENV: ${{ secrets.SOK_ENV }}

  windows:
    name: Windows installer
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      SOK_ENV: ${{ secrets.SOK_ENV }}

  macos:
    name: macOS disk image
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      SOK_ENV: ${{ secrets.SOK_ENV }}
