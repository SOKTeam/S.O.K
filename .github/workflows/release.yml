name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.sha }}
          check-name: 'Code Quality & Tests'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  release:
    name: Create Release
    needs: wait-for-ci
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      # Set by the successCmd of .releaserc.json when a version is published.
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/exec \
            @semantic-release/github

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  sync-develop:
    # semantic-release pushes its chore(release) commit (version + CHANGELOG)
    # straight to main: merge main back so develop stays level with it.
    name: Sync develop with main
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -m "chore(merge): merge branch 'main' into develop" origin/main
          git push origin develop

  linux:
    name: Linux AppImages
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-linux.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      SOK_ENV: ${{ secrets.SOK_ENV }}

  windows:
    name: Windows installer
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      SOK_ENV: ${{ secrets.SOK_ENV }}

  macos:
    name: macOS disk image
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    secrets:
      SOK_ENV: ${{ secrets.SOK_ENV }}

  docker:
    name: S.O.K Server image
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      tag: v${{ needs.release.outputs.version }}

  demo:
    # The demo of S.O.K Server on the website (/demo): built from this version
    # (npm run build:demo) and put in public/demo on the branch release/vX.Y.Z
    # of SOKTeam/site, made from its master when there is none; publish then
    # merges it. Its data (web/src/demo/data.json) are recorded by hand with
    # scripts/record_demo.py. A demo that fails never holds the release back.
    name: Demo for the website
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout the version
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the demo
        working-directory: web
        run: |
          npm ci
          npm run build:demo

      - name: Put it on the branch of the website
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
          BRANCH: release/v${{ needs.release.outputs.version }}
          SITE: SOKTeam/site
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No SITE_TOKEN secret: the demo of the website is not updated."
            exit 0
          fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${SITE}.git"
          if ! git clone --quiet --branch "$BRANCH" "$url" site 2>/dev/null; then
            git clone --quiet --branch master "$url" site
            git -C site checkout --quiet -b "$BRANCH"
          fi
          rm -rf site/public/demo
          cp -r web/dist-demo site/public/demo
          cd site
          git add -A public/demo
          if git diff --cached --quiet; then
            echo "The demo of the website is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore: update the demo of S.O.K Server to v$VERSION"
          git push --quiet origin "$BRANCH"
          echo "Demo of v$VERSION put on $BRANCH."

  publish:
    # The release is created as a draft (.releaserc.json), so the apps and the
    # website never see it without its packages. It is published once the
    # three builds have attached them and the server image is pushed; if one
    # fails, it stays a draft.
    name: Publish the release
    needs: [release, linux, windows, macos, docker, demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "v${{ needs.release.outputs.version }}"
          --draft=false --latest --repo "${{ github.repository }}"

      - name: Update the website
        # The website shows the downloads of the latest release when it is
        # built. Its changes for this version wait on the branch
        # release/vX.Y.Z of SOKTeam/site: it is fast-forwarded into master,
        # which Vercel deploys. Without that branch, or if master moved since
        # it was made, the Vercel deploy hook rebuilds master as it is.
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
          BRANCH: release/v${{ needs.release.outputs.version }}
          SITE: SOKTeam/site
        run: |
          if [ -n "$GH_TOKEN" ] &&
            sha=$(gh api "repos/$SITE/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null); then
            if gh api -X PATCH "repos/$SITE/git/refs/heads/master" \
              -f sha="$sha" -F force=false > /dev/null; then
              gh api -X DELETE "repos/$SITE/git/refs/heads/$BRANCH"
              echo "Merged $BRANCH into master: Vercel deploys it."
              exit 0
            fi
            echo "::warning::Could not fast-forward master to $BRANCH (master moved, or SITE_TOKEN cannot write): merge it by hand."
          else
            echo "No $BRANCH branch (or no SITE_TOKEN secret)."
          fi
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "SITE_DEPLOY_HOOK is not set: the website is not rebuilt."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SITE_DEPLOY_HOOK" > /dev/null
          echo "Website rebuild requested."
