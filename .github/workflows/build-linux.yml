name: Build Linux AppImage

on:
  # Run by hand from the Actions tab, on any branch or tag.
  workflow_dispatch:
  # Build the AppImage of each published release.
  release:
    types: [published]
  # Check that packaging changes still build (without the API keys).
  pull_request:
    branches: [develop, main]
    paths:
      - scripts/build_sok.py
      - packaging/linux/**
      - .github/workflows/build-linux.yml

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture on the oldest glibc its PySide6 wheels support
          # (see build_appimage.sh), on a native runner.
          - arch: x86_64
            runner: ubuntu-latest
            image: almalinux:9
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: almalinux:10
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write the API keys
        if: github.event_name != 'pull_request'
        env:
          SOK_ENV: ${{ secrets.SOK_ENV }}
        run: |
          if [ -z "$SOK_ENV" ]; then
            echo "::error::Add the .env contents as the SOK_ENV repository secret."
            exit 1
          fi
          printf '%s\n' "$SOK_ENV" > .env

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash packaging/linux/build_appimage.sh --allow-missing-keys
          else
            bash packaging/linux/build_appimage.sh
          fi

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SOK-Linux-AppImage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
