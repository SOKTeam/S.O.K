name: Build Linux AppImage

on:
  # Run by hand from the Actions tab (or gh workflow run), on any branch or tag.
  workflow_dispatch:
  # Called by release.yml once semantic-release has published a version: a
  # release created with GITHUB_TOKEN triggers no "release" event.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the AppImages to.
        type: string
        required: true
    secrets:
      SOK_ENV:
        required: true

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each architecture on the oldest glibc its PySide6 wheels support
          # (see build_appimage.sh), on a native runner.
          - arch: x86_64
            runner: ubuntu-latest
            image: almalinux:9
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: almalinux:10
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Write the API keys
        env:
          SOK_ENV: ${{ secrets.SOK_ENV }}
        run: |
          if [ -z "$SOK_ENV" ]; then
            echo "::error::Add the .env contents as the SOK_ENV repository secret."
            exit 1
          fi
          printf '%s\n' "$SOK_ENV" > .env

      - name: Build
        run: bash packaging/linux/build_appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SOK-Linux-AppImage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  attach:
    name: Attach to the release
    needs: appimage
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: SOK-Linux-AppImage-*
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" ./*.AppImage --clobber --repo "${{ github.repository }}"
