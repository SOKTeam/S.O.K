name: Build Windows installer

on:
  # Run by hand from the Actions tab (or gh workflow run), on any branch or tag.
  workflow_dispatch:
  # Called by release.yml once semantic-release has published a version: a
  # release created with GITHUB_TOKEN triggers no "release" event.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the installer to.
        type: string
        required: true
    secrets:
      SOK_ENV:
        required: true

permissions:
  contents: read

jobs:
  installer:
    name: Setup .exe (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Nuitka compiles against a regular CPython install with MSVC (on the
      # runner image).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the build dependencies
        run: uv sync --frozen --extra build --python "$pythonLocation/python.exe"

      # Upgrade installs Inno Setup when the runner image lacks it, and
      # brings it to a version that knows WizardStyle "modern windows11".
      - name: Install Inno Setup
        shell: pwsh
        run: choco upgrade innosetup -y --no-progress

      - name: Write the API keys
        env:
          SOK_ENV: ${{ secrets.SOK_ENV }}
        run: |
          if [ -z "$SOK_ENV" ]; then
            echo "::error::Add the .env contents as the SOK_ENV repository secret."
            exit 1
          fi
          printf '%s\n' "$SOK_ENV" > .env

      - name: Build the app
        run: uv run --frozen --no-sync python scripts/build_sok.py

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installation.iss'

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: SOK-Windows-Setup
          path: dist/SOK_Setup_v*.exe
          if-no-files-found: error

  attach:
    name: Attach to the release
    needs: installer
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: SOK-Windows-Setup

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" ./SOK_Setup_v*.exe --clobber --repo "${{ github.repository }}"
